name: arm64

# Native arm64 builds (GitHub's ubuntu-24.04-arm runners). the dev host must not
# emulate aarch64 (it ran out of memory doing so), so arm64 is built here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write only to publish the Duet test build as a (pre)release: release
# assets download without a GitHub login, Actions artifacts don't.
permissions:
  contents: write

# Queue rather than cancel: a full build takes long, and every run starts cold.
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The runner's disk is small next to a Qt + Basecamp closure.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = auto
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=

      - name: Build Basecamp and BasecampOS apps (aarch64)
        run: |
          nix build -L --keep-going \
            .#packages.aarch64-linux.basecamp \
            .#packages.aarch64-linux.system-core \
            .#packages.aarch64-linux.system-ui \
            .#packages.aarch64-linux.launcher-browser \
            .#packages.aarch64-linux.launcher-terminal \
            .#packages.aarch64-linux.lgpm \
            .#packages.aarch64-linux.shrooms-agent
          mkdir -p out
          for r in result*; do find -L "$r" -maxdepth 1 -name '*.lgx' -exec cp {} out/ \; ; done
          tar -C result -czf out/basecamp-bundle-aarch64.tar.gz .
          ls -la out

      - name: Build the whole basecampos-arm system
        run: |
          nix build -L .#packages.aarch64-linux.toplevel -o system
          nix path-info -Sh ./system

      - name: Build the Duet system (basecampos-duet)
        run: |
          nix build -L .#packages.aarch64-linux.duet-test-toplevel -o duet
          nix path-info -Sh ./duet

      - name: ARMv8.0 check (no LSE atomics on the Duet's MT8183)
        run: |
          scripts/check-lse.sh ./duet || true
          n=$(wc -l < lse-report.txt)
          [ "$n" -eq 0 ] || echo "::warning::$n files in the Duet closure use LSE atomics (see lse-report.txt)"

      - name: Duet rootfs tarball + kernel (Image, dtbs) for signing
        run: |
          mkdir -p diag
          set -o pipefail
          {
            set -ex
            df -h / /nix
            rm -rf system
            nix build -L .#packages.aarch64-linux.duet-test-rootfs -o duet-rootfs
            nix build -L .#packages.aarch64-linux.duet-test-kernel -o duet-kernel
            mkdir -p out-duet/kernel
            # The rootfs (3.8 GB) stays in the store: publishing splits it from
            # there. Three copies filled the runner's disk (74ca827..732804c).
            cp duet-rootfs/README.txt lse-report.txt out-duet/
            cp duet-kernel/Image out-duet/kernel/
            cp duet-kernel/dtbs/mediatek/mt8183-kukui-krane-sku*.dtb out-duet/kernel/
            # modules are a separate output of the kernel; its version names their dir
            nix eval --raw .#packages.aarch64-linux.duet-test-kernel.modDirVersion > out-duet/kernel/modules-version.txt
            sha256sum out-duet/kernel/* > out-duet/kernel/SHA256SUMS
            ls -laR out-duet
          } 2>&1 | tee diag/rootfs-step.log

      - name: Publish the Duet test build as a prerelease (no login needed to download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diag
          exec > >(tee diag/publish.log) 2>&1
          set -x
          gh --version; gh auth status || true
          # Only the results are GC roots now: drop the build-time closure.
          df -h / /nix; nix-collect-garbage >/dev/null 2>&1 || true; df -h / /nix
          tag=duet-test-${GITHUB_SHA::7}
          mkdir rel
          cp out-duet/kernel/Image out-duet/kernel/*.dtb out-duet/kernel/modules-version.txt rel/
          cp out-duet/lse-report.txt out-duet/README.txt rel/
          # release assets are limited to 2 GB each
          split -b 1900M -d duet-rootfs/basecampos-duet-rootfs.tar.zst rel/basecampos-duet-rootfs.tar.zst.part
          # Delta against the previous Duet test release (store paths it lacks +
          # the full registration + profile links), and this release's own path
          # list for the next delta. Applying: see the notes below.
          export LC_ALL=C   # comm needs both lists sorted the same way
          nix path-info -r ./duet | sort > rel/store-paths.txt
          system=$(readlink -f ./duet); echo "$system" > rel/system.txt
          prev=$(gh release list --limit 30 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("duet-test-")) | select(.tagName != "'"$tag"'")] | sort_by(.createdAt) | last | .tagName // ""')
          deltaNote="No delta (no previous release with store-paths.txt)."
          if [ -n "$prev" ] && gh release download "$prev" -p store-paths.txt -O prev-paths.txt; then
            comm -13 prev-paths.txt rel/store-paths.txt > new-paths.txt
            mkdir -p delta/nix/var/nix/profiles
            ln -s "$system" delta/nix/var/nix/profiles/system-$GITHUB_RUN_NUMBER-link
            ln -s system-$GITHUB_RUN_NUMBER-link delta/nix/var/nix/profiles/system
            nix-store --dump-db $(cat rel/store-paths.txt) > delta/nix-path-registration
            tar --sort=name --owner=0 --group=0 --numeric-owner -cf - -C delta . -C / $(sed 's|^/||' new-paths.txt) |
              zstd -T0 -12 -o rel/delta-from-${prev#duet-test-}.tar.zst
            deltaNote="Delta from $prev ($(wc -l < new-paths.txt) new store paths, $(du -h rel/delta-from-*.tar.zst | cut -f1)): on a root holding $prev (e.g. a btrfs snapshot of it): zstd -dc delta-from-${prev#duet-test-}.tar.zst | tar -C ROOT -xpf - ; then either boot it (the first boot registers the paths) or, running in it, sudo duet-apply-generation (live switch when the kernel is unchanged)."
          fi
          (cd rel && sha256sum * > SHA256SUMS)
          # Create first, then upload file by file with retries: a 2 GB upload
          # that fails once must not lose the round (74ca827 did).
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "Duet test build ${GITHUB_SHA::7}" \
            --notes "Duet test build (watchdog, 20-minute test window unless /var/lib/basecampos-test/keep exists, reports in /var/log/basecampos-test). Rootfs parts: cat basecampos-duet-rootfs.tar.zst.part* > basecampos-duet-rootfs.tar.zst. Kernel modules: $(cat rel/modules-version.txt). Image sha256: $(sha256sum rel/Image | cut -c1-16)…. $deltaNote"
          # SHA256SUMS last: once it is there, everything it names is too.
          for f in $(ls rel/* | grep -v '/SHA256SUMS$') rel/SHA256SUMS; do
            ok=
            for i in 1 2 3 4; do
              gh release upload "$tag" "$f" --clobber && { ok=1; break; }
              echo "upload of $f failed (try $i), retrying"; sleep 60
            done
            [ -n "$ok" ] || { echo "::error::cannot upload $f"; exit 1; }
          done
          df -h / /nix

      - name: Diagnostics (always; published as a release when the run fails)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diag
          df -h > diag/df.txt 2>&1 || true
          cp lse-report.txt diag/ 2>/dev/null || true
          ls -la duet-kernel/ duet-kernel/dtbs/mediatek 2>/dev/null | head -50 > diag/kernel-ls.txt || true
          # Actions logs and artifacts need a GitHub login; release assets don't.
          if [ "${{ job.status }}" != "success" ]; then
            gh release create "ci-diag-${GITHUB_SHA::7}" diag/* --prerelease --target "$GITHUB_SHA" \
              --title "CI diagnostics ${GITHUB_SHA::7}" --notes "Diagnostics of a failed arm64 run." || true
            # Also with plain git (needs no gh): branch ci-diag, dir <sha7>/, readable without a login.
            d=$(mktemp -d); git -C $d init -q; git -C $d checkout -q -b ci-diag
            mkdir $d/${GITHUB_SHA::7}; cp diag/* $d/${GITHUB_SHA::7}/ 2>/dev/null || true
            git -C $d -c user.name=ci -c user.email=ci@localhost add -A
            git -C $d -c user.name=ci -c user.email=ci@localhost commit -q -m "diagnostics ${GITHUB_SHA::7}"
            git -C $d fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-diag 2>/dev/null &&
              git -C $d rebase -q FETCH_HEAD || true
            git -C $d push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-diag:ci-diag || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: diag/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: basecampos-duet-rootfs-${{ github.sha }}
          path: out-duet/
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: basecampos-aarch64-${{ github.sha }}
          path: out/
          retention-days: 14
